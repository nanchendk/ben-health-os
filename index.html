<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>Ben Health OS｜私人健康儀表板</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="app">
    <header class="hero"><div><p class="eyebrow">PRIVATE HEALTH DASHBOARD</p><h1>Ben Health OS</h1><p class="subtitle">私人健康管理 · Firebase 安全登入</p></div><div id="accountArea"></div></header>
    <section id="loginView" class="card login">
      <h2>私人健康儀表板</h2>
      <p>登入並通過帳號驗證後，才會向私人資料庫讀取健康紀錄。</p>
      <button id="loginBtn" type="button">使用 Google 帳號登入</button>
      <p id="loginStatus" class="hint" role="status">等待登入</p>
    </section>
    <section id="dashboardView" hidden>
      <div class="grid">
        <article class="card"><h2>最新體重</h2><strong class="big-number" id="latestWeight">未回報</strong><p class="hint" id="weightDate">尚無紀錄</p></article>
        <article class="card"><h2>Week 14｜恢復觀察</h2><strong class="big-number" id="weekAverage">未匯入</strong><p class="hint" id="weekStatus">尚無週報資料</p></article>
      </div>
      <section class="card"><h2>每日健康紀錄</h2><p class="hint">未回報欄位保持空白，不會自動視為 0。資料僅儲存於授權的 Firestore 路徑。</p>
        <form id="dailyForm" class="form-grid">
          <label>日期<input id="recordDate" type="date" required></label>
          <label>晨間體重（kg）<input id="weight" type="number" min="20" max="300" step="0.05" placeholder="未回報"></label>
          <label>睡眠（小時）<input id="sleepHours" type="number" min="0" max="24" step="0.1" placeholder="未回報"></label>
          <label>飲水（ml）<input id="waterMl" type="number" min="0" max="15000" step="1" placeholder="未回報"></label>
          <label>排便與腸胃狀況<textarea id="gutNotes" rows="3" placeholder="未回報"></textarea></label>
          <label>其他紀錄<textarea id="notes" rows="3" placeholder="未回報"></textarea></label>
          <div><button type="submit" id="saveBtn">儲存私人紀錄</button></div>
        </form>
        <p id="saveStatus" class="hint" role="status"></p>
      </section>
      <section class="card"><h2>最近紀錄</h2><div id="recentRecords" class="records"><p class="hint">尚無資料</p></div></section>
    </section>
  </main>
  <script type="module" src="./app.js"></script>
</body>
</html>
