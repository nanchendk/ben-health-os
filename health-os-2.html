<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Ben Health OS 2.0｜私人健康報告</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#fcfcfa; --surface:#f2f3f0; --card:#ffffff; --ink:#15202b; --muted:#4e5a66; --faint:#6b7783;
  --rule:#d5d9dd; --track:#e3e6e2; --blue:#304a67; --orange:#9a4512; --orange-line:#b5541c;
  --good:#1f5c3e; --shade:#ebece8; --hero:#15202b; --hero-ink:#ffffff; --hero-muted:#c3ccd5; --hero-line:#3a4a5b;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#12171c; --surface:#1a2027; --card:#1e252d; --ink:#e8edf1; --muted:#a9b4bf; --faint:#8f9aa5;
    --rule:#343e48; --track:#2c353f; --blue:#8fb0d3; --orange:#f0a16c; --orange-line:#e08a52;
    --good:#7fcf9f; --shade:#232b33; --hero:#26364a; --hero-ink:#ffffff; --hero-muted:#c3ccd5; --hero-line:#41556c;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#12171c; --surface:#1a2027; --card:#1e252d; --ink:#e8edf1; --muted:#a9b4bf; --faint:#8f9aa5;
  --rule:#343e48; --track:#2c353f; --blue:#8fb0d3; --orange:#f0a16c; --orange-line:#e08a52;
  --good:#7fcf9f; --shade:#232b33; --hero:#26364a; --hero-ink:#ffffff; --hero-muted:#c3ccd5; --hero-line:#41556c;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;font-size:16px;line-height:1.6;font-variant-numeric:tabular-nums;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
button,input{font:inherit;color:inherit}
a{color:var(--blue)}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:6px}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--rule)}
.top .wrap{display:flex;align-items:center;gap:16px;min-height:64px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;margin-right:auto}
.mark{width:32px;height:32px;border-radius:8px;background:var(--ink);color:var(--paper);display:grid;place-items:center}
.tabs{display:flex;gap:4px}
.tabs a{min-height:44px;padding:0 14px;display:inline-flex;align-items:center;gap:8px;border-radius:8px;text-decoration:none;color:var(--muted);font-weight:500;font-size:15px}
.tabs a[aria-current="page"]{background:var(--surface);color:var(--ink);font-weight:700}
.sync{position:relative}
.sync>button{min-height:40px;padding:0 12px;border-radius:20px;border:1px solid var(--rule);background:var(--card);display:inline-flex;align-items:center;gap:8px;font-size:13px;cursor:pointer}
.dot{width:8px;height:8px;border-radius:4px;background:var(--good);flex:none}
.dot.warn{background:var(--orange-line)}
.pop{position:absolute;right:0;top:calc(100% + 8px);width:min(340px,calc(100vw - 32px));background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:16px;box-shadow:0 12px 32px rgba(0,0,0,.12);font-size:14px}
.pop[hidden]{display:none}
.pop h3{margin:0 0 8px;font-size:15px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px solid var(--rule)}
.kv:last-child{border:0}
.kv span:first-child{color:var(--muted)}
.proto{font-size:12px;color:var(--muted);border:1px dashed var(--rule);border-radius:6px;padding:2px 8px}

/* Narrow mobile devices: prevent clipped statistics, long text, and inaccessible navigation. */
@media (max-width:480px){
 html,body{max-width:100%;overflow-x:hidden}
 main{padding-left:12px;padding-right:12px;padding-bottom:calc(100px + env(safe-area-inset-bottom,0px))}
 .panel{padding:14px}
 .mgrid{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
 .m{padding:10px 8px}
 .m strong{font-size:clamp(15px,4.1vw,19px);overflow-wrap:anywhere}
 .m em,.m span,.sub,.prose{overflow-wrap:anywhere}
 .chips{max-width:100%;-webkit-overflow-scrolling:touch}
 .strip{gap:3px}
 .cell{padding:6px 2px;min-width:0;font-size:11px;overflow-wrap:anywhere}
 .chart{min-width:0;overflow:hidden}
 .big{font-size:clamp(44px,12vw,64px)}
 button,input,select{max-width:100%}
}
/* bottom nav (mobile) */
.bottom{display:none}
@media (max-width:760px){
  .tabs{display:none}
  .proto{display:none}
  .bottom{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--paper);border-top:1px solid var(--rule);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
  .bottom a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:52px;text-decoration:none;color:var(--muted);font-size:12px;font-weight:500}
  .bottom a[aria-current="page"]{color:var(--ink);font-weight:700}
  main{padding-bottom:96px}
}

main{padding-top:28px;padding-bottom:64px}
.view[hidden]{display:none}
h1{font-size:clamp(26px,4vw,34px);line-height:1.2;margin:0;font-weight:900;letter-spacing:-.01em}
h2{font-size:18px;margin:0 0 12px;line-height:1.35}
.sub{color:var(--muted);margin:6px 0 0;font-size:15px}
.stack{display:flex;flex-direction:column;gap:20px}
.panel{background:var(--card);border:1px solid var(--rule);border-radius:14px;padding:20px}
.muted{color:var(--muted)}
.small{font-size:13px}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:500;padding:2px 8px;border-radius:6px;border:1px solid var(--rule);color:var(--muted);white-space:nowrap}
.badge.ok{border-color:var(--good);color:var(--good)}
.badge.todo{border-style:dashed;border-color:var(--orange-line);color:var(--orange)}
.badge.ill{background:var(--shade);border-color:var(--shade);color:var(--ink)}
.badge.est{border-style:dotted}

/* hero */
.hero{background:var(--hero);color:var(--hero-ink);border-radius:18px;padding:24px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:28px;align-items:end}
@media (max-width:760px){.hero{grid-template-columns:1fr;gap:22px;padding:20px}}
.hero .lbl{color:var(--hero-muted);font-size:14px}
.big{font-size:clamp(52px,9vw,76px);font-weight:900;line-height:.95;letter-spacing:-.03em}
.big small{font-size:.32em;font-weight:500;letter-spacing:0;margin-left:6px}
.delta{font-size:16px;font-weight:500;margin-top:10px;color:var(--hero-muted)}
.delta strong{color:var(--hero-ink)}
.ruler svg{width:100%;height:auto;display:block}
.ruler .cap{display:flex;justify-content:space-between;font-size:13px;color:var(--hero-muted);margin-top:6px}

/* goals */
.goals{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:900px){.goals{grid-template-columns:repeat(2,minmax(0,1fr))}}
.goal{background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.goal .t{font-size:14px;color:var(--muted)}
.goal .v{font-size:28px;font-weight:700;line-height:1.1}
.goal .v small{font-size:14px;font-weight:500;color:var(--muted)}
.goal .f{font-size:13px;color:var(--muted)}
.bar{height:6px;border-radius:3px;background:var(--track);overflow:hidden}
.bar i{display:block;height:100%;background:var(--blue)}
.segs{display:grid;gap:4px}
.segs i{height:6px;border-radius:3px;background:var(--track)}
.segs i.on{background:var(--blue)}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;text-align:center;font-size:12px;color:var(--muted)}
.days span{display:flex;flex-direction:column;align-items:center;gap:4px}
.days b{width:14px;height:14px;border-radius:7px;border:1.5px solid var(--faint);display:block}
.days b.on{background:var(--ink);border-color:var(--ink)}
.days b.future{border-style:dotted;border-color:var(--rule)}

.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px}
@media (max-width:860px){.split{grid-template-columns:1fr}}
.notes{list-style:none;margin:0;padding:0}
.notes li{padding:12px 0;border-bottom:1px solid var(--rule);display:flex;flex-direction:column;gap:2px}
.notes li:last-child{border:0}
.notes .why{font-size:13px;color:var(--muted)}

/* charts */
.chart svg{width:100%;height:auto;display:block;overflow:visible}
.chart text{font-family:inherit;fill:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:16px;font-size:13px;color:var(--muted);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:18px;height:3px;background:var(--ink);display:inline-block}
.sw.dash{background:none;border-top:2.5px dashed var(--faint);height:0}
.sw.box{width:14px;height:14px;background:var(--shade);border-radius:3px}
.linkbtn{background:none;border:0;padding:0;min-height:44px;color:var(--blue);font-weight:500;cursor:pointer;text-decoration:underline;text-underline-offset:3px}

/* weeks */
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.chip{flex:none;min-height:44px;padding:0 14px;border-radius:22px;border:1px solid var(--rule);background:var(--card);cursor:pointer;font-size:14px;font-weight:500;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip .x{width:7px;height:7px;border-radius:4px;background:var(--orange-line)}
.mgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:760px){.mgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.m{display:flex;flex-direction:column;gap:2px;padding:12px;border-radius:10px;background:var(--surface);min-width:0}
.m span{font-size:13px;color:var(--muted)}
.m strong{font-size:20px;line-height:1.3}
.m em{font-style:normal;font-size:12px;color:var(--muted)}
.prose{max-width:68ch}
.prose h3{font-size:15px;margin:16px 0 4px}
.prose p{margin:0}
.strip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cell{border:1px solid var(--rule);border-radius:8px;padding:8px 6px;text-align:center;font-size:13px;min-width:0}
.cell b{display:block;font-size:15px}
.cell.none{border-style:dashed;color:var(--faint)}
.cell.future{background:transparent;border-style:dotted;color:var(--faint)}

/* tables */
.tbl{overflow-x:auto;border:1px solid var(--rule);border-radius:12px}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:560px}
th,td{padding:11px 14px;text-align:left;border-top:1px solid var(--rule);vertical-align:top}
thead th{border-top:0;background:var(--surface);color:var(--muted);font-weight:500;white-space:nowrap}
td.num,th.num{text-align:right}
.flag{font-weight:700;color:var(--orange)}
.pending{color:var(--faint)}
.pending b{font-weight:500;border-bottom:1.5px dashed var(--orange-line)}

/* medical lock */
.lock{max-width:460px;margin:24px auto;text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px}
.lock .ic{width:64px;height:64px;border-radius:16px;background:var(--surface);display:grid;place-items:center}
.lock form{width:100%;display:flex;flex-direction:column;gap:10px;text-align:left}
.lock label{font-size:14px;color:var(--muted)}
.lock input{min-height:52px;border:1px solid var(--faint);border-radius:10px;padding:0 14px;background:var(--card);font-size:17px}
.primary{min-height:52px;border:0;border-radius:10px;background:var(--ink);color:var(--paper);font-weight:700;cursor:pointer;font-size:16px}
.ghost{min-height:40px;padding:0 14px;border-radius:20px;border:1px solid var(--rule);background:var(--card);cursor:pointer;font-size:14px}
.err{color:var(--orange);font-size:14px;min-height:1.6em;margin:0}
.unlockbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.demo{border:1px dashed var(--orange-line);color:var(--orange);border-radius:10px;padding:10px 14px;font-size:14px}
@media (prefers-reduced-motion:no-preference){
  .view{animation:in .18s ease-out}
  @keyframes in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
}

/* Ben Health OS 2.0 — warm ivory, sage and natural editorial design */
:root,:root[data-theme="dark"]{
 --paper:#f8f7f2;--surface:#f3f4ef;--card:#fffefa;--ink:#17271f;--muted:#56645b;--faint:#768079;
 --rule:#e1e3d9;--track:#e6e9df;--blue:#365b48;--orange:#975b27;--orange-line:#c18146;
 --good:#34694f;--shade:#e8efe7;--hero:#eef5ed;--hero-ink:#172d20;--hero-muted:#4a6555;--hero-line:#c7d9c9;
 color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#f8f7f2;--surface:#f3f4ef;--card:#fffefa;--ink:#17271f;--muted:#56645b;--faint:#768079;--rule:#e1e3d9;--track:#e6e9df;--blue:#365b48;--orange:#975b27;--orange-line:#c18146;--good:#34694f;--shade:#e8efe7;--hero:#eef5ed;--hero-ink:#172d20;--hero-muted:#4a6555;--hero-line:#c7d9c9;color-scheme:light}}
body{background:radial-gradient(ellipse at 86% 8%,#f4f0e5 0,transparent 40%),var(--paper)}
.wrap{max-width:1360px}
.top{position:relative;top:auto;background:transparent;border:0;padding-top:18px}
.top .wrap{display:block;min-height:0}
.brand-hero{position:relative;overflow:hidden;min-height:178px;border-radius:19px 19px 0 0;padding:26px 30px;display:flex;justify-content:space-between;align-items:center;gap:20px;color:#fff;background:
 linear-gradient(112deg,rgba(26,63,49,.95) 0%,rgba(55,83,66,.80) 43%,rgba(151,153,124,.43) 100%),
 radial-gradient(ellipse at 86% 0%,#dccbac 0%,#718f7b 48%,#284e43 100%)}
.brand-hero::before,.brand-hero::after{content:"";position:absolute;inset:auto -8% -42% 25%;height:155%;border-radius:45% 55% 0 0;transform:rotate(-7deg);pointer-events:none;background:linear-gradient(135deg,transparent 32%,rgba(227,220,193,.19) 68%,rgba(43,74,55,.28));clip-path:polygon(0 100%,15% 58%,27% 75%,45% 38%,61% 59%,80% 23%,100% 43%,100% 100%)}
.brand-hero::after{inset:auto -12% -49% 32%;height:140%;transform:rotate(5deg);opacity:.65;background:linear-gradient(145deg,transparent,#193f36 75%)}
.brand-hero .brand,.brand-motto{position:relative;z-index:1}
.brand-hero .brand{color:#fff;align-items:center;gap:22px;margin:0;font-weight:700}
.brand-hero .mark{width:76px;height:76px;flex:none;border-radius:17px;background:rgba(16,50,41,.72);color:#fff;border:1px solid rgba(255,255,255,.13)}
.brand-title,.brand-caption,.brand-desc{display:block}
.brand-title{font-size:clamp(31px,3.4vw,51px);font-weight:900;line-height:1.14;letter-spacing:-.03em}
.brand-caption{font-size:clamp(10px,1.1vw,14px);letter-spacing:.23em;opacity:.88;margin-top:4px}
.brand-desc{font-size:14px;letter-spacing:.06em;margin-top:7px;opacity:.95}
.brand-motto{font-size:16px;letter-spacing:.08em;line-height:1.9;margin:0;text-align:left;flex:none}
.header-toolbar{display:flex;align-items:center;gap:14px;background:#fffefa;border:1px solid var(--rule);border-top:0;border-radius:0 0 18px 18px;padding:8px 16px;min-height:62px;box-shadow:0 10px 24px rgba(49,62,43,.045)}
.tabs{flex:1;gap:6px;flex-wrap:wrap}
.tabs a{color:#31463a;font-size:15px;border-radius:10px}
.tabs a[aria-current="page"]{background:#e7eee5;color:#214b35;box-shadow:inset 0 0 0 1px #cbdaca}
.proto{white-space:nowrap;border:1px solid var(--rule);border-radius:30px;padding:5px 10px}
.sync>button{background:#f9faf5}
main.wrap{padding-top:16px;padding-bottom:72px}
.panel{border-color:var(--rule);border-radius:18px;background:var(--card);box-shadow:0 5px 20px rgba(48,59,43,.028)}
.import-panel{margin:0 0 22px;padding:0}
.import-panel summary{display:flex;align-items:center;gap:14px;padding:17px 20px;cursor:pointer;list-style:none}
.import-panel summary::-webkit-details-marker{display:none}
.import-icon{width:43px;height:43px;flex:none;display:grid;place-items:center;border-radius:12px;background:#e9eee5;font-size:26px;color:#41654d}
.import-copy{flex:1;display:flex;flex-direction:column;min-width:0}
.import-copy strong{font-size:16px}
.import-copy small{font-size:12px;color:var(--muted)}
.import-action{padding:7px 13px;border-radius:20px;border:1px solid var(--rule);white-space:nowrap;font-size:13px}
.import-panel details[open] .import-action{background:#ecf2e9}
.import-content{border-top:1px solid var(--rule);padding:10px 20px 20px}
.import-content input{max-width:100%;margin-right:12px}
.hero{background:linear-gradient(135deg,#fffefa 0%,#f4f7ed 60%,#e9f0e6 100%);color:var(--ink);border:1px solid #dce5d7;border-radius:19px;box-shadow:0 7px 26px rgba(54,77,52,.045);padding:24px 28px}
.hero .lbl{color:#4a6352;font-weight:500}
.hero .big{color:#193c2b}
.hero .delta,.hero .delta strong{color:#45654b}
.hero .ruler .cap{color:#496450;gap:10px;flex-wrap:wrap}
.hero .ruler svg text{fill:#47624f}
.mgrid{grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}
.m{padding:18px 19px;background:#fffefa;border:1px solid #e7e9df;border-radius:15px;box-shadow:0 4px 13px rgba(50,70,49,.035);gap:5px;min-height:114px}
.m strong{font-size:clamp(18px,1.6vw,23px);line-height:1.35;overflow-wrap:anywhere}
.m span{color:#526456}
.m em{color:#687669}
.days b.on{background:#3a7152;border-color:#3a7152}
#h-week,#h-trend{letter-spacing:-.02em}
.stack{gap:18px}
.notes li{border:1px solid #ebe8dd;border-radius:12px;background:#fbfaf5;margin-bottom:8px;padding:11px 14px}
.notes li:last-child{border:1px solid #ebe8dd}
#v-week .split>.panel:first-child{border-color:#e9ddc7;background:#fffdf8}
#v-week .split>.panel:first-child h2::before{content:"⚠";color:#c37f39;margin-right:8px}
.chip[aria-pressed="true"]{background:#244935;color:#fff;border-color:#244935}
.bottom{box-shadow:0 -7px 22px rgba(44,62,45,.07)}
@media(max-width:900px){.brand-hero{min-height:154px}.brand-motto{font-size:13px}.header-toolbar{gap:8px}.tabs a{padding:0 9px;font-size:13px}.proto{display:none}}
@media(max-width:760px){
 .top{padding-top:0}.top .wrap{padding:0}
 .brand-hero{min-height:134px;border-radius:0 0 18px 18px;padding:24px 18px;align-items:center}
 .brand-hero .brand{gap:12px}
 .brand-hero .mark{width:52px;height:52px;border-radius:14px}
 .brand-hero .mark svg{width:27px;height:27px}
 .brand-title{font-size:clamp(25px,6vw,34px)}
 .brand-caption{font-size:8px;letter-spacing:.15em}
 .brand-desc{font-size:11px;margin-top:4px}
 .brand-motto,.header-toolbar .proto{display:none}
 .header-toolbar{position:absolute;top:100%;right:12px;transform:translateY(-50%);min-height:auto;padding:0;background:transparent;border:0;box-shadow:none;z-index:2}
 .header-toolbar .sync>button{background:#fffefa;box-shadow:0 3px 12px rgba(0,0,0,.09)}
 .header-toolbar .sync .pop{z-index:10}
 main.wrap{padding:34px 14px calc(110px + env(safe-area-inset-bottom,0px))}
 .import-panel summary{padding:13px}
 .import-icon{height:38px;width:38px}
 .import-copy strong{font-size:14px}
 .import-copy small{font-size:11px}
 .import-action{font-size:11px;padding:5px 9px}
 .hero{grid-template-columns:1fr;gap:17px;padding:18px 17px}
 .big{font-size:clamp(46px,12vw,64px)}
 .hero .ruler .cap{font-size:11px;display:grid;grid-template-columns:1fr 1fr}
 .hero .ruler .cap span:last-child{text-align:right}
 .mgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
 .m{padding:14px 12px;min-height:116px}

        <div><span class="brand-title">Ben Health OS</span><span class="brand-caption">PRIVATE HEALTH DASHBOARD</span><span class="brand-desc">健康趨勢 · 身體組成 · 醫療紀錄</span></div>

window.addEventListener('unhandledrejection',function(e){var x=document.getElementById('mobileBootError');if(x)x.textContent='資料或登入載入異常：'+(e.reason?.code||e.reason?.message||'未知錯誤')});

<script type="module">
/* ------------------------------------------------------------------
   示意資料。欄位名稱與 ben-health-data 同步到 Firestore 的格式一致：
   users/{uid}/weeks/W{n}、daily/{date}、bodyComposition/{id}、
   medical/{id}（加密）、meta/lastSync。正式版把 DATA 換成 Firestore 讀取即可。
------------------------------------------------------------------- */
const DATA = {
 today: new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Taipei'}),
 config:{week1Start:'2026-07-13',targetWeightKg:80,targets:{proteinMinG:120,proteinMaxG:150,trainingPerWeek:3}},
 lastSync:{finishedAt:null,commit:'Firestore',counts:{created:0,updated:0},readBack:{expected:0,matched:0}},
 weeks:[],daily:[],bodyComposition:[],medicalIndex:[]
};
const MEDICAL_DEMO = null;

/* ---------------- 工具 ---------------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const DAY = 86400000;
const toUtc = (d) => { const [y, m, dd] = d.split('-').map(Number); return Date.UTC(y, m - 1, dd); };
const addDays = (d, n) => new Date(toUtc(d) + n * DAY).toISOString().slice(0, 10);
const WD = ['日', '一', '二', '三', '四', '五', '六'];
const wd = (d) => WD[new Date(toUtc(d)).getUTCDay()];
const md = (d) => `${+d.slice(5, 7)}/${+d.slice(8, 10)}`;
const ymd = (d) => d.replaceAll('-', '/');
const weekStart = (n) => addDays(DATA.config.week1Start, (n - 1) * 7);
const weekNo = (d) => Math.floor((toUtc(d) - toUtc(DATA.config.week1Start)) / (7 * DAY)) + 1;
const fmt = (x, d = 1) => (x === undefined || x === null ? '—' : Number(x).toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d }));
const signed = (x, d = 1) => (x > 0 ? '+' : x < 0 ? '−' : '±') + fmt(Math.abs(x), d);
const INTERF = { illness: '疾病', dehydration: '脫水', travel: '旅行', other: '其他干擾' };

const weeks = DATA.weeks;
const byWeek = {};
let current = null;
let dataThrough = '';

/* ---------------- 導覽與路由 ---------------- */
const ICONS = {
  week: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="16" rx="2"/><path d="M3.5 9.5h17M8 2.5v4M16 2.5v4"/></svg>',
  trend: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 20h18"/><path d="M4 15l5-5 4 3 7-7"/></svg>',
  body: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="5" r="2.5"/><path d="M6 10h12M12 10v5M9 21l3-6 3 6"/></svg>',
  medical: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><rect x="4.5" y="10.5" width="15" height="10" rx="2"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/></svg>'
};
const ROUTES = [['week', '本週'], ['trend', '趨勢與週報'], ['body', '身體組成'], ['medical', '醫療']];
const navHtml = (short) => ROUTES.map(([id, name]) => `<a href="#${id}" data-r="${id}">${ICONS[id]}<span>${short && id === 'trend' ? '趨勢' : name}</span></a>`).join('');
$('#tabs').innerHTML = navHtml(false);
$('#bottom').innerHTML = navHtml(true);

function route() {
  const id = (location.hash.slice(1) || 'week');
  const r = ROUTES.some(([k]) => k === id) ? id : 'week';
  ROUTES.forEach(([k]) => { $('#v-' + k).hidden = k !== r; });
  document.querySelectorAll('[data-r]').forEach((a) => { if (a.dataset.r === r) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
  if (r !== 'medical' && unlockTimer) lockMedical();
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', route);

/* ---------------- 同步狀態 ---------------- */
function renderSync() {
  const s = DATA.lastSync;
  const stale = !dataThrough || dataThrough < addDays(DATA.today, -2);
  const okRead = false;
  $('#syncDot').classList.toggle('warn', !okRead || stale);
  $('#syncLabel').textContent = dataThrough ? `資料更新至 ${md(dataThrough)}（${wd(dataThrough)}）` : '尚無可用紀錄';
  const t = s.finishedAt ? new Date(s.finishedAt) : null;
  const local = new Intl.DateTimeFormat('zh-TW', { timeZone: 'Asia/Taipei', month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit', hour12: false }).format(t||new Date());
  $('#syncPop').innerHTML = `
    <h3>資料同步</h3>
    <div class="kv"><span>最後同步</span><span>${t?local:'未提供同步時間'}</span></div>
    <div class="kv"><span>讀回核對</span><span>尚未執行資料庫讀回驗證</span></div>
    <div class="kv"><span>本次變更</span><span>新增 ${s.counts.created}，更新 ${s.counts.updated}</span></div>
    <div class="kv"><span>最新紀錄日期</span><span>${dataThrough ? ymd(dataThrough) + '（' + wd(dataThrough) + '）' : '未回報'}</span></div>
    <div class="kv"><span>版本</span><span>${esc(s.commit)}</span></div>
    <p class="small muted" style="margin:10px 0 0">${DATA.today > dataThrough ? `今天（${md(DATA.today)}）尚無紀錄；未確認同步排程。` : '已包含今天的資料。'}</p>`;
}
$('#syncBtn').addEventListener('click', (e) => {
  const pop = $('#syncPop');
  pop.hidden = !pop.hidden;
  e.currentTarget.setAttribute('aria-expanded', String(!pop.hidden));
});
document.addEventListener('click', (e) => {
  if (!e.target.closest('.sync')) { $('#syncPop').hidden = true; $('#syncBtn').setAttribute('aria-expanded', 'false'); }
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !$('#syncPop').hidden) { $('#syncPop').hidden = true; $('#syncBtn').setAttribute('aria-expanded', 'false'); $('#syncBtn').focus(); } });

/* ---------------- 圖表 ---------------- */
// 週平均體重：每週固定位置、干擾週灰底、排除週空心點、連到排除週的線段改虛線
function weightChart(list, { w = 680, h = 240, selected = null, mini = false } = {}) {
  const padL = mini ? 8 : 44, padR = mini ? 8 : 16, padT = mini ? 10 : 18, padB = mini ? 24 : 34;
  const vals = list.filter((x) => x.weightKg.avg !== undefined).map((x) => x.weightKg.avg);
  const lo = Math.floor(Math.min(...vals) - 0.3), hi = Math.ceil(Math.max(...vals) + 0.3);
  const n0 = list[0].week, n1 = list[list.length - 1].week;
  const step = (w - padL - padR) / Math.max(1, n1 - n0);
  const X = (n) => padL + (n - n0) * step;
  const Y = (v) => padT + (hi - v) / (hi - lo) * (h - padT - padB);
  let s = `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="第 ${n0} 到第 ${n1} 週的週平均體重，從 ${fmt(list[0].weightKg.avg, 1)} 公斤到 ${fmt(list[list.length - 1].weightKg.avg, 1)} 公斤；灰底為疾病或脫水干擾週">`;
  list.forEach((x) => {
    if (x.interference.length || x.excludeFromFatLoss) s += `<rect x="${X(x.week) - step / 2}" y="${padT - 6}" width="${step}" height="${h - padT - padB + 6}" fill="var(--shade)"/>`;
  });
  if (!mini) {
    for (let v = lo; v <= hi; v++) {
      s += `<line x1="${padL}" x2="${w - padR}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--rule)" stroke-dasharray="${v === lo ? '' : '2 5'}"/>`;
      s += `<text x="${padL - 8}" y="${Y(v) + 4}" text-anchor="end" font-size="12">${v}</text>`;
    }
  }
  for (let i = 1; i < list.length; i++) {
    const a = list[i - 1], b = list[i];
    if (a.weightKg.avg === undefined || b.weightKg.avg === undefined) continue;
    const ex = a.excludeFromFatLoss || b.excludeFromFatLoss;
    s += `<line x1="${X(a.week)}" y1="${Y(a.weightKg.avg)}" x2="${X(b.week)}" y2="${Y(b.weightKg.avg)}" stroke="${ex ? 'var(--faint)' : 'var(--ink)'}" stroke-width="${mini ? 2 : 2.6}" stroke-linecap="round" ${ex ? 'stroke-dasharray="4 5"' : ''}/>`;
  }
  list.forEach((x) => {
    if (x.weightKg.avg === undefined) return;
    const ex = x.excludeFromFatLoss, sel = selected === x.week, open = x.status === 'open';
    const r = sel ? 7 : mini ? 3.5 : 5;
    s += `<circle cx="${X(x.week)}" cy="${Y(x.weightKg.avg)}" r="${r}" fill="${ex || open ? 'var(--card)' : 'var(--ink)'}" stroke="${ex ? 'var(--faint)' : 'var(--ink)'}" stroke-width="2" ${open ? 'stroke-dasharray="2 2"' : ''} data-week="${x.week}" style="cursor:pointer"/>`;
    if (sel && !mini) s += `<text x="${X(x.week)}" y="${Y(x.weightKg.avg) - 14}" text-anchor="middle" font-size="13" font-weight="700" style="fill:var(--ink)">${fmt(x.weightKg.avg, 2)}</text>`;
    s += `<text x="${X(x.week)}" y="${h - (mini ? 6 : 10)}" text-anchor="middle" font-size="${mini ? 11 : 12}" ${sel ? 'font-weight="700" style="fill:var(--ink)"' : ''}>W${x.week}</text>`;
  });
  return s + '</svg>';
}

// 本週主視覺：起點到目標的刻度尺
function ruler(start, now, prev, target) {
  const w = 520, h = 84, L = 10, R = 10;
  const X = (v) => L + (start - v) / (start - target) * (w - L - R);
  let s = `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="從起點 ${fmt(start)} 公斤到目標 ${fmt(target)} 公斤，目前 ${fmt(now, 2)} 公斤">`;
  s += `<line x1="${L}" x2="${w - R}" y1="46" y2="46" stroke="var(--hero-line)" stroke-width="2"/>`;
  s += `<line x1="${L}" x2="${X(now)}" y1="46" y2="46" stroke="var(--hero-ink)" stroke-width="4" stroke-linecap="round"/>`;
  for (let v = Math.floor(start); v >= target; v--) {
    const major = v % 5 === 0;
    s += `<line x1="${X(v)}" x2="${X(v)}" y1="${major ? 34 : 40}" y2="52" stroke="var(--hero-line)" stroke-width="${major ? 2 : 1}"/>`;
    if (major) s += `<text x="${X(v)}" y="72" text-anchor="middle" font-size="13" fill="var(--hero-muted)">${v}</text>`;
  }
  if (prev !== undefined) s += `<circle cx="${X(prev)}" cy="46" r="5" fill="none" stroke="var(--hero-muted)" stroke-width="1.5"/>`;
  s += `<circle cx="${X(now)}" cy="46" r="8" fill="var(--hero-ink)"/>`;
  s += `<text x="${X(now)}" y="22" text-anchor="middle" font-size="14" font-weight="700" fill="var(--hero-ink)">現在</text>`;
  s += `<circle cx="${X(target)}" cy="46" r="7" fill="none" stroke="var(--hero-ink)" stroke-width="2"/>`;
  return s + '</svg>';
}

function lineChart(points, { w = 520, h = 160, digits = 1, label = '' } = {}) {
  if (points.length < 2) return '';
  const padL = 40, padR = 16, padT = 16, padB = 30;
  const vs = points.map((p) => p.v);
  const lo = Math.floor(Math.min(...vs) - 0.5), hi = Math.ceil(Math.max(...vs) + 0.5);
  const t0 = toUtc(points[0].d), t1 = toUtc(points[points.length - 1].d);
  const X = (d) => padL + (toUtc(d) - t0) / Math.max(1, t1 - t0) * (w - padL - padR);
  const Y = (v) => padT + (hi - v) / (hi - lo) * (h - padT - padB);
  let s = `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(label)}">`;
  [lo, hi].forEach((v) => { s += `<line x1="${padL}" x2="${w - padR}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--rule)" ${v === hi ? 'stroke-dasharray="2 5"' : ''}/><text x="${padL - 8}" y="${Y(v) + 4}" text-anchor="end" font-size="12">${v}</text>`; });
  s += `<polyline points="${points.map((p) => `${X(p.d)},${Y(p.v)}`).join(' ')}" fill="none" stroke="var(--ink)" stroke-width="2.4" stroke-linejoin="round"/>`;
  points.forEach((p, i) => {
    s += `<circle cx="${X(p.d)}" cy="${Y(p.v)}" r="4.5" fill="${p.ill ? 'var(--card)' : 'var(--ink)'}" stroke="var(--ink)" stroke-width="2"/>`;
    if (i === 0 || i === points.length - 1) s += `<text x="${X(p.d)}" y="${Y(p.v) - 10}" text-anchor="${i === 0 ? 'start' : 'end'}" font-size="12" font-weight="700" style="fill:var(--ink)">${fmt(p.v, digits)}</text>`;
    s += `<text x="${X(p.d)}" y="${h - 8}" text-anchor="${i === 0 ? 'start' : i === points.length - 1 ? 'end' : 'middle'}" font-size="12">${md(p.d)}</text>`;
  });
  return s + '</svg>';
}

/* ---------------- 本週 ---------------- */
function goalCard(title, value, unit, foot, visual) {
  return `<div class="goal"><span class="t">${title}</span><span class="v">${value}<small>${unit}</small></span>${visual || ''}<span class="f">${foot}</span></div>`;
}

function renderWeek() {
  const w = current, T = DATA.config.targets;
  const start = weekStart(w.week), end = addDays(start, 6);
  const prev = byWeek[w.week - 1];
  const dailyMap = Object.fromEntries(DATA.daily.map((d) => [d.date, d]));
  const remaining = Math.max(0, Math.min(7, Math.ceil((toUtc(end) - toUtc(DATA.today)) / DAY + 1)));

  // 依規則產生、附上依據的提醒（不寫沒有依據的建議）
  const notes = [];
  const missing = [];
  for (let i = 0; i < 7; i++) { const d = addDays(start, i); if (d <= dataThrough && typeof dailyMap[d]?.weightKg !== 'number') missing.push(d); }

  if (w.proteinReportedDays) notes.push([`蛋白質 ${w.proteinReportedDays} 天中有 ${w.proteinTargetHitDays} 天達 ${T.proteinMinG} g`, `日均 ${fmt(w.proteinG.avg, 0)} g${w.proteinG.includesEstimate ? '，含估算值' : ''}；目標 ${T.proteinMinG}–${T.proteinMaxG} g。`]);
  if (missing.length) notes.push([`${missing.map((d) => `${md(d)}（${wd(d)}）`).join('、')} 在 Firestore 缺少每日體重`, w.weightKg.historicalOfficial ? `本週 ${fmt(w.weightKg.avg,2)} kg 採歷史正式結案平均，不是以目前 Firestore ${w.reportedDays} 天重新計算；請勿將資料庫缺筆誤判為當天未回報。` : `目前週平均以 ${w.weightKg.n} 天計算，缺少的每日紀錄未納入。`]);
  if (w.waterMl.n > 0 && w.waterMl.n < w.reportedDays) notes.push([`飲水只有 ${w.waterMl.n} 天有紀錄`, `有紀錄的日均 ${fmt(w.waterMl.avg, 0)} ml，紀錄天數太少，暫不判讀。`]);

  const dots = Array.from({ length: 7 }, (_, i) => {
    const d = addDays(start, i);
    const on = typeof dailyMap[d]?.weightKg === 'number';
    const future = d > dataThrough;
    return `<span><b class="${on ? 'on' : future ? 'future' : ''}"></b>${wd(d)}</span>`;
  }).join('');

  const startWeight = typeof dailyMap[start]?.weightKg === 'number' ? dailyMap[start].weightKg : w.weightKg.avg;
  const verifiedStart = typeof dailyMap[start]?.weightKg === 'number';
  const done = startWeight - w.weightKg.avg;
  const total = startWeight - DATA.config.targetWeightKg;
  const progressPct = total > 0 ? Math.max(0, Math.min(100, Math.round(done / total * 100))) : 0;
  const recent = weeks.slice(-9);

  $('#v-week').innerHTML = `
  <div class="stack">
    <div>
      <h1 id="h-week">第 ${w.week} 週</h1>
      <p class="sub">${md(start)}（${wd(start)}）到 ${md(end)}（${wd(end)}），${w.status==='closed'?'已結案':'進行中'}，${w.weightKg.historicalOfficial?'採歷史正式週平均；Firestore '+w.reportedDays+' 天每日紀錄':'已有 '+w.weightKg.n+' 天體重紀錄'}</p>
    </div>

    <section class="hero" aria-label="本週體重">
      <div>
        <div class="lbl">本週平均體重</div>
        <div class="big">${fmt(w.weightKg.avg, 2)}<small>kg</small></div>
        <div class="delta">${w.vsPrevWeek ? (w.vsPrevWeek.comparable ? `較上週 <strong>${signed(w.vsPrevWeek.deltaKg, 2)} kg</strong>` : '上週為干擾週，不比較') : ''}</div>
      </div>
      <div class="ruler">
        ${ruler(startWeight, w.weightKg.avg, prev?.weightKg.avg, DATA.config.targetWeightKg)}
        <div class="cap"><span>第 ${w.week} 週起點 ${fmt(startWeight, 2)} kg${verifiedStart?'':'（以週平均暫代）'}</span><span>${done >= 0 ? '本週減少' : '本週增加'} ${fmt(Math.abs(done), 2)} kg，距目標 ${fmt(Math.max(0, w.weightKg.avg - DATA.config.targetWeightKg), 2)} kg（本週進度 ${progressPct}%）</span><span>目標 ${fmt(DATA.config.targetWeightKg)} kg</span></div>
      </div>
    </section>

    <section aria-labelledby="h-goals">
      <h2 id="h-goals">本週健康摘要</h2>
      <div class="mgrid">
        <div class="m"><span>平均體重</span><strong>${fmt(w.weightKg.avg, 2)} kg</strong><em>${w.weightKg.historicalOfficial?'歷史正式結案平均':w.weightKg.n+' 天體重紀錄的平均'}</em></div>
        <div class="m"><span>週變化</span>${w.vsPrevWeek ? (w.vsPrevWeek.comparable ? `<strong>${signed(w.vsPrevWeek.deltaKg, 2)} kg</strong><em>與第 ${w.week-1} 週相比</em>` : `<strong>不比較</strong><em>${w.excludeFromFatLoss?'本週為干擾週':'前週為干擾週'}</em>`) : '<strong class="muted">—</strong><em>沒有可比較的前週</em>'}</div>

/* ---------------- 趨勢與週報 ---------------- */

    ? (w.vsPrevWeek.comparable ? `<strong>${signed(w.vsPrevWeek.deltaKg, 2)} kg</strong><em>與第 ${w.week - 1} 週相比</em>` : `<strong>不比較</strong><em>${byWeek[w.week].excludeFromFatLoss ? '本週為干擾週' : `第 ${w.week - 1} 週為干擾週`}</em>`)

    if (d > dataThrough) return `<div class="cell future">${wd(d)}<b>未到</b></div>`;
    if (typeof x?.weightKg !== 'number') return `<div class="cell none">${wd(d)}<b>${w.weightKg.historicalOfficial?'資料庫缺筆':'未有紀錄'}</b></div>`;
    return `<div class="cell">${wd(d)}<b>${fmt(x.weightKg)}</b></div>`;
  }).join('')}</div>` : '';

  $('#v-trend').innerHTML = `
  <div class="stack">
    <div>
      <h1 id="h-trend">趨勢與週報</h1>

    </div>
    <section class="panel" aria-labelledby="h-wchart">
      <h2 id="h-wchart">每週平均體重趨勢</h2>
      <p class="small muted" style="margin:-4px 0 12px">${ymd(weekStart(weeks[0].week))}－${ymd(addDays(weekStart(weeks[weeks.length-1].week),6))} · 共 ${weeks.length} 週紀錄</p>
      <div class="chart" id="trendChart">${weightChart(weeks, { selected: selectedWeek })}</div>
      <p class="small" style="margin:12px 0 4px">${weeks[0].weightKg.avg > weeks[weeks.length-1].weightKg.avg ? '從 '+fmt(weeks[0].weightKg.avg,2)+' kg 降至 '+fmt(weeks[weeks.length-1].weightKg.avg,2)+' kg，差 '+fmt(weeks[0].weightKg.avg-weeks[weeks.length-1].weightKg.avg,2)+' kg。' : '從 '+fmt(weeks[0].weightKg.avg,2)+' kg 變化至 '+fmt(weeks[weeks.length-1].weightKg.avg,2)+' kg。'}${weeks.some(x=>x.excludeFromFatLoss)?' 疾病、脫水等干擾週只呈現紀錄，不視為正常減脂成果。':''}</p>
      <div class="legend">
        <span><i class="sw"></i>週平均</span>
        <span><i class="sw dash"></i>經過干擾週的變化</span>
        <span><i class="sw box"></i>疾病或脫水週</span>

    </div>

    <section class="panel" aria-labelledby="h-report">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:14px">

          <span class="small muted">${ymd(start)} 到 ${ymd(end)}</span>
        </div>
        <div style="display:flex;gap:6px;flex-wrap:wrap">
          <span class="badge ${w.status === 'closed' ? 'ok' : ''}">${w.status === 'closed' ? '已結案' : '進行中'}</span>
          ${w.interference.map((k) => `<span class="badge ill">${INTERF[k]}</span>`).join('')}
          ${w.excludeFromFatLoss ? '<span class="badge todo">不列入減脂評估</span>' : ''}

      </div>
      <div class="mgrid">
        <div class="m"><span>平均體重</span>${w.weightKg.n ? `<strong>${fmt(w.weightKg.avg, 2)} kg</strong><em>${w.weightKg.historicalOfficial?'正式結案值；目前 Firestore '+w.reportedDays+' 天每日體重':'Firestore '+w.weightKg.n+' 天有紀錄'}</em>` : '<strong class="muted">未回報</strong>'}</div>
        <div class="m"><span>週變化</span>${vs}</div>
        <div class="m"><span>蛋白質</span>${w.proteinG.historical ? `<strong>${esc(w.proteinG.rangeText)}</strong><em>歷史營養估算，非每日實測</em>` : w.proteinG.n ? `<strong>${w.proteinTargetHitDays} / ${w.proteinReportedDays} 天達標</strong><em>日均 ${fmt(w.proteinG.avg, 0)} g${w.proteinG.includesEstimate ? '，含估算' : ''}</em>` : '<strong class="muted">無可靠週平均</strong><em>不能據此認定當週未攝取蛋白質</em>'}</div>

        <h3>歷史資料對帳</h3><p class="small muted">${w.weightKg.historicalOfficial?'體重採正式結案週平均；Firestore 目前 '+w.reportedDays+' 天每日體重。':'體重採 Firestore 週資料；每日體重 '+w.reportedDays+' 天。'}${w.week===12?' 疾病前代表體重 '+(w.preIllnessAverageWeightKg??'89.25')+' kg，疾病與脫水期間體重不作減脂判斷。':''}</p><p class="small muted">${esc(w.exerciseStatus||'運動沒有可靠完成紀錄，不以 0 次視為未運動。')} ${esc(w.waterStatus||'飲水無完整可靠週平均。')}</p><h3>營養資料來源與完整性</h3><p class="small muted">${esc(w.historicalNutritionNote||'目前沒有已核對的歷史營養摘要；未回報不等於未進食。')}</p><p class="small muted">${w.historicalSource?'來源：'+esc(w.historicalSource)+'；':'資料來源：Firestore；'}估算值不作為每日實測數值。</p>
        <h3>下週策略</h3>

  const pick = (n) => { selectedWeek = n; renderTrend(); $(`.chip[data-week="${n}"]`)?.focus({ preventScroll: true }); };
  document.querySelectorAll('#v-trend .chip').forEach((b) => b.addEventListener('click', () => pick(+b.dataset.week)));
  document.querySelectorAll('#trendChart circle[data-week]').forEach((c) => c.addEventListener('click', () => pick(+c.dataset.week)));
}

/* ---------------- 身體組成 ---------------- */

  const panels = Object.entries(groups).map(([inst, rows]) => {

        <div><h3 class="small muted" style="margin:0 0 4px">骨骼肌（kg）</h3><div class="chart">${lineChart(rows.map((r) => ({ d: r.date, v: r.smmKg, ill: !!r.interference })), { label: `${inst} 骨骼肌趨勢` })}</div></div>
      </div>` : `<p class="small muted" style="margin:8px 0 0">這台設備只有一次量測，累積兩次以上才會畫出趨勢。</p>`;

        ${unverified ? `<span class="badge todo">${unverified} 筆待核對原始報告</span>` : '<span class="badge ok">已核對</span>'}

        <div class="m"><span>骨骼肌</span><strong>${fmt(last.smmKg)} kg</strong>${rows.length > 1 ? `<em>較首次 ${signed(last.smmKg - rows[0].smmKg)} kg</em>` : ''}</div>
        <div class="m"><span>體脂率</span><strong>${fmt(last.bodyFatPct)} %</strong>${rows.length > 1 ? `<em>較首次 ${signed(last.bodyFatPct - rows[0].bodyFatPct)}</em>` : ''}</div>
        <div class="m"><span>內臟脂肪</span>${last.visceralFatLevel !== undefined ? `<strong>${last.visceralFatLevel} 級</strong>` : '<strong class="muted">未量測</strong><em>這台設備沒有此項</em>'}</div>
      </div>
      ${charts}
    </section>`;
  }).join('');
  $('#v-body').innerHTML = `
  <div class="stack">
    <div>
      <h1 id="h-body">身體組成</h1>
      <p class="sub">不同設備的量測方式不同，各自看自己的變化，不互相比較。</p>
    </div>
    ${panels || '<section class="panel"><h2>尚無可顯示的身體組成紀錄</h2><p class="muted">Firestore 資料尚未對應到可用的量測欄位，或尚未完成驗證。原始資料未刪除。請勿將這個狀態視為沒有做過檢測。</p></section>'}
  </div>`;
}

/* ---------------- 醫療：只解密已加密紀錄，舊資料不會在未解鎖時顯示 ---------------- */
const VERIFIER={salt:'q3TT+7vwg4G12rQYRvn71A==',iv:'1ioi5zYp1VsFe1Lf',ciphertext:'hCvK2dt7GjI3/Ks7x2l9q+ElBcOM9EkEtdqblURenztGl3//KA==',iterations:600000};
let unlockTimer=null,unlockUntil=0,medicalKey=null,medicalRecords=[],legacyMedical=[];
const b64=u=>btoa(String.fromCharCode(...new Uint8Array(u)));
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function derive(pw){const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt:unb64(VERIFIER.salt),iterations:VERIFIER.iterations,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function decryptDoc(key,doc){const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(doc.iv)},key,unb64(doc.ciphertext));return JSON.parse(new TextDecoder().decode(plain))}
async function encryptDoc(key,value){const iv=crypto.getRandomValues(new Uint8Array(12));const ciphertext=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,new TextEncoder().encode(JSON.stringify(value)));return {version:1,iv:b64(iv),ciphertext:b64(ciphertext),encryptedAt:new Date().toISOString()}}
function lockMedical(render=true){if(unlockTimer)clearInterval(unlockTimer);unlockTimer=null;unlockUntil=0;medicalKey=null;medicalRecords=[];if(render)renderMedicalLocked()}
function renderMedicalLocked(){
 $('#v-medical').innerHTML=`<div class="lock"><div class="ic">${ICONS.medical}</div><h1 id="h-medical">醫療檔案已上鎖</h1><p class="muted">需先使用授權 Google 帳號登入，再輸入醫療密碼。解密僅在本裝置進行。</p><form id="unlockForm"><label for="medPw">醫療密碼</label><input id="medPw" type="password" autocomplete="off" required><p class="err" id="medErr" role="alert"></p><button class="primary">解鎖醫療資料</button></form><p class="small muted">閒置五分鐘、離開醫療頁或切換 App 時自動上鎖。忘記密碼將無法復原加密資料。</p></div>`;
 $('#unlockForm').onsubmit=async e=>{e.preventDefault();const input=$('#medPw');const pw=input.value;input.value='';try{const key=await derive(pw);const v=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(VERIFIER.iv)},key,unb64(VERIFIER.ciphertext));if(new TextDecoder().decode(v)!=='ben-health-medical-v1')throw Error('invalid');medicalKey=key;const snap=await getDocs(collection(db,'users',activeUser.uid,'medicalEncrypted'));medicalRecords=await Promise.all(snap.docs.map(async d=>({id:d.id,data:await decryptDoc(key,d.data())})));renderMedicalUnlocked()}catch(err){medicalKey=null;$('#medErr').textContent='無法解鎖，請確認密碼或加密資料狀態。'}};
}
function renderMedicalUnlocked(){
 unlockUntil=Date.now()+300000;
 const rows=medicalRecords.map(r=>`<details class="panel"><summary><strong>${esc(r.data.date||r.id)}</strong>　${esc(r.data.type||r.data.reportType||'醫療紀錄')}</summary><pre style="white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px">${esc(JSON.stringify(r.data,null,2))}</pre></details>`).join('');
 $('#v-medical').innerHTML=`<div class="stack"><div class="unlockbar"><div><h1 id="h-medical">醫療檔案</h1><p class="sub" id="lockLeft"></p></div><button class="ghost" id="lockNow">立即上鎖</button></div><p class="small muted">目前顯示已在瀏覽器加密、存入 Firestore 的紀錄；既有未加密診所資料不會自動公開。</p>${rows||'<section class="panel"><h2>尚無已加密的醫療紀錄</h2><p>可將既有 Firestore 醫療資料加密複製進保護區。</p></section>'}<section class="panel"><h2>既有醫療資料轉入加密區</h2><p class="small muted">偵測到 ${legacyMedical.length} 筆舊資料。執行後會建立加密副本，原始資料不刪除，待核對後再另行處理。</p><button class="ghost" id="migrate" ${legacyMedical.length?'':'disabled'}>加密匯入舊紀錄</button><p id="migrateStatus" role="status" class="small muted"></p></section></div>`;
 $('#lockNow').onclick=()=>lockMedical();
 $('#migrate').onclick=async()=>{const btn=$('#migrate');btn.disabled=true;const status=$('#migrateStatus');try{let n=0;for(const item of legacyMedical){const enc=await encryptDoc(medicalKey,item.data);await setDoc(doc(db,'users',activeUser.uid,'medicalEncrypted',item.id),enc);n++}status.textContent='已加密寫入 '+n+' 筆，舊資料仍保留。請重新解鎖檢查。'}catch(e){status.textContent='加密匯入未完成：'+(e.code||e.message)}};
 if(unlockTimer)clearInterval(unlockTimer);
 unlockTimer=setInterval(()=>{const left=Math.max(0,unlockUntil-Date.now());if(!left){lockMedical();return}const el=$('#lockLeft');if(el)el.textContent=Math.ceil(left/1000)+' 秒後自動上鎖'},1000);
}
['pointerdown','keydown','scroll'].forEach(ev=>window.addEventListener(ev,()=>{if(unlockTimer)unlockUntil=Date.now()+300000},{passive:true}));
document.addEventListener('visibilitychange',()=>{if(document.hidden&&unlockTimer)lockMedical()});

const auth=getAuth(initializeApp(firebaseConfig)),db=getFirestore(auth.app);

const gate=document.createElement('section');gate.className='panel';gate.style='max-width:460px;margin:48px auto;text-align:center';gate.innerHTML='<h1>Ben Health OS 2.0</h1><p>登入授權 Google 帳號後，才會讀取私人健康資料。</p><button class="primary" id="googleLogin">使用 Google 登入</button><p id="loginMsg" role="status"></p>';
document.querySelector('main').before(gate);document.querySelector('#mobileBootStatus').hidden=true;
document.querySelector('main').hidden=true;document.querySelector('.top').hidden=true;document.querySelector('.bottom').hidden=true;
const isMobileBrowser=()=>/iPhone|iPad|iPod|Android/i.test(navigator.userAgent);

const numeric=(o,...keys)=>{for(const k of keys)if(typeof o?.[k]==='number')return o[k];return undefined};
function normalizeWeek(r){
 const raw=String(r.week??r.id??''); const hit=raw.match(/(?:^|[^0-9])W(?:eek)?\s*0?(\d{1,2})(?!\d)/i)||raw.match(/^\s*(\d{1,2})\s*$/); const week=hit?Number(hit[1]):null;
 const avg=numeric(r,'averageWeightKg','avgWeightKg')??numeric(r.weightKg,'avg');
 if(!week||week>53||avg===undefined)return null;
 const n=numeric(r,'weightDays','reportedDays','validWeightDays')??r.weightKg?.n??0;
 const interference=Array.isArray(r.interference)?r.interference:(week===12?['illness','dehydration']:week===13?['illness']:[]);
 return {week,status:r.status==='open'?'open':(r.status==='closed'||week<=14?'closed':'open'),reportedDays:n,weightKg:{avg,n},proteinG:{avg:numeric(r,'averageProteinG'),n:0},proteinTargetHitDays:0,proteinReportedDays:0,trainingDays:0,trainingReportedDays:0,sleepH:{avg:undefined,n:0},waterMl:{avg:undefined,n:0},kcal:{avg:undefined,n:0},interference,excludeFromFatLoss:week===12||week===13||r.excludeFromFatLoss===true,note:r.notes||r.note||'',strategy:r.strategy||''}
}

// 歷史檔只在授權登入後由使用者選擇；私人營養紀錄不寫入公開 GitHub。
function historyWeekNo(x){const m=String(x.id||x.week||'').match(/W(?:eek)?0?(\d{1,2})$/i)||String(x.week||'').match(/^(\d{1,2})$/);return m?Number(m[1]):null}
function applyHistory(w,h){
 if(!h)return;
 const range=(a,b,unit)=>Array.isArray(a)&&a.length===2?{avg:(Number(a[0])+Number(a[1]))/2,n:0,historical:true,rangeText:a[0]+'–'+a[1]+' '+unit,sourceLabel:'估算區間'}:null;
 // 舊版 JSON 的 W10/W11 僅將估算區間寫在 nutritionStatus，保守解析明確標記的每日區間。
 const note=String(h.nutritionStatus||'');
 const caloriesText=note.match(/熱量[^\d]{0,16}(\d{3,4})\s*[～~\-–至]\s*(\d{3,4})\s*kcal(?:\s*\/\s*day|\s*\/\s*日|\s*每天)?/i);
 const proteinText=note.match(/蛋白質[^\d]{0,16}(\d{1,3})\s*[～~\-–至]\s*(\d{1,3})\s*g(?:\s*\/\s*day|\s*\/\s*日|\s*每天)?/i);
 const parsedRange=(m,unit)=>m?{avg:(+m[1]+ +m[2])/2,n:0,historical:true,rangeText:m[1]+'–'+m[2]+' '+unit,sourceLabel:'由歷史週報文字提取，待核對'}:null;
 const nut=h.nutritionEstimate||{};
 // 歷史週報營養資料優先；只把明確標記為「日均」的區間當成週平均。
 const statusText=String(h.nutritionStatus||'');
 const dailyAverage=(label,unit)=>{const re=label==='kcal'?/(?:每日|日均|平均)[^\n]{0,35}?(\d{3,4})\s*[～~–-]\s*(\d{3,4})\s*kcal/i:/蛋白質[^\n]{0,20}?(\d{1,3})\s*[～~–-]\s*(\d{1,3})\s*g\s*\/\s*day/i;const m=statusText.match(re);return m?{avg:(Number(m[1])+Number(m[2]))/2,n:0,historical:true,rangeText:m[1]+'–'+m[2]+' '+unit,sourceLabel:'歷史週報估算區間'}:null;};
 const kcal=range(nut.caloriesKcalPerDayRange,null,'kcal/日')||dailyAverage('kcal','kcal/日')||parsedRange(caloriesText,'kcal/日');
 const protein=range(nut.proteinGPerDayRange,null,'g/日')||dailyAverage('protein','g/日')||parsedRange(proteinText,'g/日');
 if(kcal&&!w.kcal?.n)w.kcal=kcal;
 if(protein&&!w.proteinG?.n)w.proteinG=protein;
 if(w.week===14&&!w.kcal?.n&&!w.kcal?.historical){
 w.kcal={avg:1575,n:0,historical:true,rangeText:'約 1220–1930 kcal/有紀錄日',sourceLabel:'六日有記錄餐點估算，非完整七日平均'};
 if(!w.proteinG?.n&&!w.proteinG?.historical)w.proteinG={avg:73.5,n:0,historical:true,rangeText:'約 53–94 g/有紀錄日',sourceLabel:'六日有記錄餐點估算，非完整七日平均'};
 w.nutritionStatus='W14 六日已記錄餐點估算；10/16 聚餐記帳假設排除，10/18 餐次不完整。';
 }
 if(!w.kcal?.n&&!w.kcal?.historical&&typeof h.averageEnergyKcalEstimate==='number')w.kcal={avg:h.averageEnergyKcalEstimate,n:0,historical:true,rangeText:h.averageEnergyKcalEstimate+' kcal/日',sourceLabel:'疾病期估算'};
 if(!w.proteinG?.n&&!w.proteinG?.historical&&typeof h.averageProteinGEstimate==='number')w.proteinG={avg:h.averageProteinGEstimate,n:0,historical:true,rangeText:h.averageProteinGEstimate+' g/日',sourceLabel:'疾病期估算'};
 // 僅當週摘要明確提供平均值時才顯示，不將缺漏補零
 
 w.nutritionStatus=h.nutritionStatus||w.nutritionStatus||'';
 if(!w.note&&typeof h.status==='string'&&h.status!=='open'&&h.status!=='closed')w.note=h.status;
 w.historicalNutritionNote=note||'歷史摘要未提供可核對的七日營養平均；不代表當週沒有飲食紀錄。';
 if(w.week===14&&w.kcal?.historical)w.historicalNutritionNote='根據10/12～10/15及10/17～10/18有記錄的餐點份量進行區間估算；10/16聚餐熱量屬記帳假設、未採用；10/18有未入鏡餐點。所示為六日已記錄餐點估算，不能當成完整七日攝取平均。';
 // W13/W14 原始歷史檔含逐日餐點文字，但多日未確認全部餐次與份量。
 // 不將「有餐點」誤算成完整七日攝取平均；直接顯示可核對的逐日紀錄覆蓋。
 if((w.week===13||w.week===14)&&!w.kcal?.historical&&!w.kcal?.n){
   w.historicalNutritionNote=(w.week===13?'W13：10/05～10/11 有逐日餐點描述，10/10、10/11 有局部營養估算；':'W14：10/12～10/18 有逐日餐點描述，10/16 聚餐 1700 kcal 為記帳假設而非實測；')+'餐點紀錄不能證明所有餐次完整，故不宣稱七日熱量或蛋白質平均。'+(note?' 原週報：'+note:'');
   w.nutritionCoverage='已有七日餐點文字；全日攝取完整度未確認';
 }
 w.historicalSource='歷史匯入 JSON';
 if(!w.strategy&&h.exerciseStatus)w.exerciseStatus=h.exerciseStatus;
 if(h.exerciseStatus){w.exerciseStatus=h.exerciseStatus;if(/(?:正式阻力訓練|阻力訓練)\s*0\s*次/.test(h.exerciseStatus)){w.trainingDays=0;w.trainingReportedDays=7;w.trainingHistorical=true;}}
 if(h.waterStatus)w.waterStatus=h.waterStatus;
 if(h.preIllnessAverageWeightKg)w.preIllnessAverageWeightKg=h.preIllnessAverageWeightKg;
 if(!w.weightKg?.n&&typeof h.validWeightDays==='number')w.weightKg.n=h.validWeightDays;
 if(!w.reportedDays&&typeof h.validWeightDays==='number')w.reportedDays=h.validWeightDays;
 if(h.averageWeightKg!=null&&typeof h.averageWeightKg==='number'){w.weightKg.avg=h.averageWeightKg;w.weightKg.historicalOfficial=true;}
 if(!w.sleepH?.historical&&typeof h.averageSleepHoursEstimate==='number')w.sleepH={avg:h.averageSleepHoursEstimate,n:h.validSleepDays||0,historical:true,rangeText:h.averageSleepHoursEstimate.toFixed(2)+' 小時',sourceLabel:'歷史結案'};
 if(h.status&&w.week<=14)w.status='closed';
}
document.querySelector('#historyImportBtn').onclick=async()=>{
 const status=document.querySelector('#historyImportMsg'),file=document.querySelector('#historyFile').files?.[0];
 if(!activeUser){status.textContent='請先登入授權帳號';return}
 if(!file){status.textContent='請先選擇歷史 JSON 檔';return}
 if(file.size>2000000){status.textContent='檔案超過 2 MB，請確認格式';return}
 const btn=document.querySelector('#historyImportBtn');btn.disabled=true;
 try{
  const payload=JSON.parse(await file.text());
  if(payload.format!=='ben-health-os-import-v2'||!Array.isArray(payload.weeks))throw Error('格式不是預期的歷史週報 JSON');
  const rows=payload.weeks.filter(x=>{const n=historyWeekNo(x);return n>=7&&n<=14});
  if(rows.length!==8||new Set(rows.map(historyWeekNo)).size!==8)throw Error('需要完整且不重複的 Week 7～14 八週摘要');
  const message=rows.map(x=>{const n=historyWeekNo(x);return 'W'+n+': '+(x.nutritionStatus||'無營養摘要')}).join('\n');
  if(!confirm('將 8 週歷史摘要寫入私人 Firestore 的 weeklyHistorical 集合，不覆蓋既有 weeks、daily。\n\n'+message+'\n\n確定匯入？')){status.textContent='已取消';return}
  for(const x of rows){const n=historyWeekNo(x);const historicalDaily=(Array.isArray(payload.daily)?payload.daily:[]).filter(d=>/^\d{4}-\d\d-\d\d$/.test(d.date||'')&&weekNo(d.date)===n);await setDoc(doc(db,'users',activeUser.uid,'weeklyHistorical','W'+String(n).padStart(2,'0')),{...x,week:n,historicalDaily,source:'user-verified-historical-json',importedAt:new Date().toISOString()})}
  status.textContent='已寫入 8 週私人歷史摘要，正在重新載入並核對。';
  await loadRealData(activeUser);
  const matched=DATA.weeks.filter(w=>w.week>=7&&w.week<=14);const count=matched.filter(w=>w.kcal?.historical||w.kcal?.n).length;status.textContent='匯入完成：8 週摘要與歷史每日資料已寫入；'+count+'/8 週有可顯示的熱量定量資料，其餘僅有文字或缺漏。請逐週查看來源說明。';
 }catch(e){status.textContent='匯入失敗：'+(e.code||e.message)}
 finally{btn.disabled=false}
};

async function loadRealData(user){
 const names=['daily','weeks','bodyComposition','labs','weeklyHistorical'];
 const snaps=await Promise.all(names.map(n=>getDocs(collection(db,'users',user.uid,n))));
 const all=Object.fromEntries(names.map((n,i)=>[n,snaps[i].docs.map(d=>({id:d.id,...d.data()}))]));
 DATA.daily.splice(0,DATA.daily.length,...all.daily.filter(x=>/^\d{4}-\d\d-\d\d$/.test(x.date||x.id)).map(x=>({date:x.date||x.id,weightKg:numeric(x,'weightKg'),sleepH:numeric(x,'sleepHours','sleepH'),waterMl:numeric(x,'waterMl'),proteinG:numeric(x,'proteinG'),notes:x.notes||'',estimated:[]})).sort((a,b)=>a.date.localeCompare(b.date)));
 // 歷史日資料與即時 daily 分離保存，缺筆才補顯示，不覆蓋當前資料庫。
 const historicalDaily=all.weeklyHistorical.flatMap(h=>Array.isArray(h.historicalDaily)?h.historicalDaily:[]);
 const existingDates=new Set(DATA.daily.map(d=>d.date));
 const restored=historicalDaily.filter(d=>/^\d{4}-\d\d-\d\d$/.test(d.date||'')&&!existingDates.has(d.date)).map(d=>({date:d.date,weightKg:numeric(d,'weightKg'),sleepH:numeric(d,'sleepHours','sleepH'),waterMl:numeric(d,'waterMl'),proteinG:numeric(d,'proteinG'),notes:d.notes||'',historical:true,estimated:[]}));
 DATA.daily.push(...restored);DATA.daily.sort((a,b)=>a.date.localeCompare(b.date));
 const normalized=all.weeks.map(normalizeWeek).filter(Boolean);
 const historical=Object.fromEntries(all.weeklyHistorical.map(x=>[historyWeekNo(x),x]).filter(([n])=>n>=7&&n<=14));
 for(const w of normalized)applyHistory(w,historical[w.week]);
 for(const [n,h] of Object.entries(historical)){if(!normalized.some(w=>w.week===Number(n))){const w=normalizeWeek(h);if(w){applyHistory(w,h);normalized.push(w)}}}
 const hasWeek12=normalized.some(w=>w.week===12);
 if(!hasWeek12){const w12weights=DATA.daily.filter(d=>weekNo(d.date)===12&&typeof d.weightKg==='number');if(w12weights.length){normalized.push({week:12,status:'closed',reportedDays:w12weights.length,weightKg:{avg:w12weights.reduce((a,d)=>a+d.weightKg,0)/w12weights.length,n:w12weights.length},proteinG:{avg:undefined,n:0},proteinTargetHitDays:0,proteinReportedDays:0,trainingDays:0,trainingReportedDays:0,sleepH:{avg:undefined,n:0},waterMl:{avg:undefined,n:0},kcal:{avg:undefined,n:0},interference:['illness','dehydration'],excludeFromFatLoss:true,note:'疾病／脫水干擾；此週平均為可用晨重的重算值，尚未核對正式結案',strategy:''})}}
 const dailyForWeek=week=>DATA.daily.filter(d=>weekNo(d.date)===week&&typeof d.weightKg==='number');
 for(const w of normalized){const ds=dailyForWeek(w.week);w.weightKg.n=w.weightKg.historicalOfficial?(w.weightKg.n||ds.length):(ds.length||w.weightKg.n);w.reportedDays=ds.length;w.officialWeightDays=w.weightKg.historicalOfficial?(w.weightKg.n||0):null;for(const [field,key] of [['sleepH','sleepH'],['waterMl','waterMl'],['proteinG','proteinG']]){const vals=DATA.daily.filter(d=>weekNo(d.date)===w.week&&typeof d[key]==='number').map(d=>d[key]);if(vals.length && !w[field]?.historical){w[field]={avg:vals.reduce((a,b)=>a+b,0)/vals.length,n:vals.length}}}}
 DATA.weeks.splice(0,DATA.weeks.length,...normalized.sort((a,b)=>a.week-b.week));
 for(const k of Object.keys(byWeek))delete byWeek[k];
 DATA.weeks.forEach(w=>byWeek[w.week]=w);
 for(let i=1;i<DATA.weeks.length;i++){const a=DATA.weeks[i-1],b=DATA.weeks[i];b.vsPrevWeek={deltaKg:b.weightKg.avg-a.weightKg.avg,comparable:!a.excludeFromFatLoss&&!b.excludeFromFatLoss&&b.week===a.week+1}}
 current=DATA.weeks.at(-1);
 DATA.bodyComposition.splice(0,DATA.bodyComposition.length,...all.bodyComposition.filter(x=>!/診所|clinic|inbody/i.test(String(x.source||x.deviceModel||''))).map(x=>({date:x.date,id:x.id,instrument:x.source||x.deviceModel||'家用設備',weightKg:numeric(x,'weightKg'),smmKg:numeric(x,'skeletalMuscleKg'),bodyFatPct:numeric(x,'bodyFatPct'),verified:x.valid!==false})));
 legacyMedical=[...all.labs.map(x=>({id:'lab-'+x.id,data:{...x,type:'檢驗'}})),...all.bodyComposition.filter(x=>/診所|clinic|inbody/i.test(String(x.source||x.deviceModel||''))).map(x=>({id:'clinic-'+x.id,data:{...x,type:'診所 InBody'}}))];
 dataThrough=DATA.daily.map(d=>d.date).sort().at(-1)||'';
 DATA.lastSync.finishedAt=null;
 DATA.lastSync.readBack.expected=all.daily.length+all.weeks.length+all.bodyComposition.length+all.labs.length;
 DATA.lastSync.readBack.matched=0;
 if(!current){document.querySelector('#v-week').innerHTML='<section class="panel"><h2>尚無週報</h2><p>Firestore 尚無可用的週報資料，請先核對資料匯入狀態。</p></section>';renderSync();renderMedicalLocked();route();return;}
 selectedWeek=current.week;renderSync();renderWeek();renderTrend();renderBody();renderMedicalLocked();route();
}
onAuthStateChanged(auth,async user=>{
 lockMedical(false);activeUser=null;
 const allowed=!!user&&user.uid===ownerUid&&user.providerData.some(p=>p.providerId==='google.com');
 document.querySelector('#mobileBootStatus').hidden=true;gate.hidden=allowed;document.querySelector('main').hidden=!allowed;document.querySelector('.top').hidden=!allowed;document.querySelector('.bottom').hidden=!allowed;
 if(!allowed){$('#loginMsg').textContent=user?'這個帳號未獲授權':'請使用 Google 帳號登入';return}
 activeUser=user;
 document.querySelector('#historicalImport').hidden=false;
 try{await loadRealData(user)}catch(e){document.querySelector('main').hidden=true;gate.hidden=false;$('#loginMsg').textContent='讀取 Firestore 失敗：'+(e.code||e.message)}
});
