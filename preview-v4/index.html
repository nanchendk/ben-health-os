<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>Ben Health OS v4｜報告預覽</title><style>body{margin:0;background:#f4f6fa;color:#0f2a4f;font:15px system-ui,'Microsoft JhengHei',sans-serif}.wrap{max-width:1050px;margin:auto;padding:20px}header{background:#0f2a4f;color:#fff;padding:25px;border-radius:16px}header h1{margin:6px 0}.card{background:white;padding:20px;margin:14px 0;border-radius:14px;box-shadow:0 2px 10px #0f2a4f0b}.nav{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}button{background:white;border:1px solid #d9e2eb;padding:11px 14px;border-radius:9px;color:#0f2a4f;cursor:pointer;font-weight:bold}button.active{background:#0f2a4f;color:white}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.metric{background:#f4f6fa;border-radius:10px;padding:14px}.metric b{display:block;font-size:24px;margin-top:8px}.muted{color:#68798a;font-size:13px;line-height:1.7}.note{background:#f6f7fa;border-left:3px solid #c9a961;padding:13px;margin-top:15px;line-height:1.8}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:11px 7px;border-bottom:1px solid #e8edf2}th{background:#f4f6fa} .scroll{overflow:auto}@media(max-width:650px){.grid{grid-template-columns:repeat(2,1fr)}.wrap{padding:12px}.metric b{font-size:19px}}</style></head><body><div class="wrap"><header><small>PRIVATE HEALTH DASHBOARD · V4 PREVIEW</small><h1>Ben Health OS</h1><small>白底 × 三竹深藍 × 香檳金｜同類型健康報告比較</small></header><div class="nav"><button data-page="overview" class="active">總覽</button><button data-page="clinic">定安診所</button><button data-page="annual">年度健檢</button><button data-page="body">InBody</button><button data-page="quality">資料品質</button></div><section class="card" id="load"><b>請載入私人報告資料</b><p class="muted">選取私人 JSON，所有資料僅在瀏覽器記憶體中使用，不上傳網站、不寫入 GitHub 或 Firestore。重新整理會清除。</p><input type="file" id="file" accept=".json,application/json"></section><main id="view"></main><p class="muted">本頁為功能驗證，不提供診斷；不同儀器、不同院所及不同報告類型不混算。公開網站程式不含你的私人健康數值。</p></div><script>
let d=null,page='overview';const esc=x=>String(x??'—').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),n=x=>typeof x==='number'&&Number.isFinite(x),delta=(a,b)=>n(a)&&n(b)?((a-b>0?'+':'')+(a-b).toFixed(2)):'—',card=(t,x)=>'<section class="card"><h2>'+t+'</h2>'+x+'</section>',table=(heads,rows)=>'<div class="scroll"><table><thead><tr>'+heads.map(x=>'<th>'+esc(x)+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+r.map(x=>'<td>'+esc(x)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>',metrics=xs=>'<div class="grid">'+xs.map(x=>'<div class="metric"><small>'+esc(x[0])+'</small><b>'+esc(x[1])+'</b></div>').join('')+'</div>';
function render(){document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));if(!d){document.getElementById('view').innerHTML=card('等待匯入','下載對話中的私人 JSON 檔，選取後就能看到你的真實健康資料。');return}let out='';
if(page==='overview')out=card('健康報告總覽',metrics([['定安診所追蹤',d.clinic.length+' 份'],['年度健檢',d.annual.length+' 份'],['InBody 正式報告',d.body.length+' 份'],['待核對截圖',d.unverifiedBody.length+' 筆'],['比較規則','同類同單位'],['私人資料','只在本機']]))+card('重點追蹤','<div class="note">定安診所：總膽紅素上升、HDL 偏低及 9 月尿液檢驗異常，建議帶原報告回診確認。</div><div class="note">年度健檢：體重與部分代謝指標改善；腎臟影像發現與 HDL 下降仍需追蹤。</div>');
if(page==='clinic'){const a=d.clinic[0],b=d.clinic[1];out=card('定安診所｜2026/6/24 → 9/23',table(['血液指標','6/24','9/23','變化'],Object.keys(b.blood).filter(k=>n(a.blood[k]?.value)&&n(b.blood[k]?.value)&&a.blood[k].unit===b.blood[k].unit).map(k=>[b.blood[k].label+' ('+b.blood[k].unit+')',a.blood[k].value,b.blood[k].value,delta(b.blood[k].value,a.blood[k].value)]))+'<div class="note">三酸甘油脂下降；LDL 略升、HDL 下降。總膽紅素連續偏高，請醫師判讀是否需進一步檢驗。</div>')+card('尿液追蹤',table(['指標','6/24','9/23'],d.urine.map(x=>[x.label,x.june,x.september]))+'<div class="note">9 月尿液異常可能與採樣或泌尿道狀況有關，不能單憑一次結果診斷。請原診所評估是否複查。</div>')}
if(page==='annual'){const a=d.annual[0],b=d.annual[1];out=card('年度健檢｜2024 → 2025',table(['項目','2024','2025','變化'],Object.keys(b.metrics).filter(k=>n(a.metrics[k]?.value)&&n(b.metrics[k]?.value)&&a.metrics[k].unit===b.metrics[k].unit).map(k=>[b.metrics[k].label+' ('+b.metrics[k].unit+')',a.metrics[k].value,b.metrics[k].value,delta(b.metrics[k].value,a.metrics[k].value)]))+'<div class="note">體重、血糖與部分肝功能指標改善，HDL 下降。單次健檢血壓不代表長期血壓控制。</div>')+card('影像檢查',table(['年度','報告所見'],d.imaging.map(x=>[x.date,x.summary]))+'<div class="note">脂肪肝影像分級有改善記載，腎囊腫仍應按醫師建議追蹤；影像和血液數值不混算。</div>')}
if(page==='body')out=card('InBody｜已核對正式報告',d.body.map(x=>'<p class="muted">'+esc(x.date)+'｜'+esc(x.deviceModel)+'</p>'+metrics([['體重',x.weightKg+' kg'],['骨骼肌量',x.skeletalMuscleKg+' kg'],['體脂肪量',x.fatMassKg+' kg'],['體脂率',x.bodyFatPct+'%'],['內臟脂肪等級',x.visceralFatLevel],['基礎代謝率',x.bmrKcal+' kcal']])).join('')+'<div class="note">同型號至少兩筆有效紀錄才計算前後變化；不同儀器不混算。</div>')+card('待核對體組成截圖',table(['體重','比較狀態'],d.unverifiedBody.map(x=>[x.weightKg+' kg','日期／型號待確認'])));
if(page==='quality')out=card('分類與比較限制',table(['資料','狀態'],[['定安診所 2026','同院所血液／尿液分組比較'],['年度健檢 2024–2025','同系列同單位比較'],['InBody 2025','單次正式報告'],['其他體組成截圖','日期／型號待確認，不混算'],['2019／2020／2022 健檢','待逐欄核對，不先混入']]))+'<div class="note">數值升降與是否異常分開顯示；不同院所的參考區間不直接套用。</div>');
document.getElementById('view').innerHTML=out;}
document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{page=b.dataset.page;render()});document.getElementById('file').onchange=async e=>{try{const x=JSON.parse(await e.target.files[0].text());if(x.format!=='ben-health-v4-private-preview-1'||!Array.isArray(x.clinic)||!Array.isArray(x.annual))throw Error('檔案格式不符');d=x;document.getElementById('load').innerHTML='<b>✓ 私人資料已在本機載入</b><p class="muted">不會傳送至網站或雲端。重新整理即清除。</p>';render()}catch(err){alert('匯入失敗：'+err.message)}};render();
</script></body></html>
