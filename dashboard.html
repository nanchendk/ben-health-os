<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Ben Health OS｜私人歷史分析</title><style>body{font-family:system-ui,"Noto Sans TC",sans-serif;background:#f5f7f9;color:#202c39;margin:0}main{max-width:1150px;margin:auto;padding:20px}section,.gate{background:white;border-radius:14px;padding:20px;margin:16px 0;box-shadow:0 2px 12px #0001}h1{font-size:26px}h2{font-size:20px}table{border-collapse:collapse;width:100%;font-size:14px}td,th{padding:9px;border-bottom:1px solid #e8edf0;text-align:left}th{white-space:nowrap} .scroll{overflow:auto}svg{max-width:100%;height:auto}button{padding:12px 20px;border:0;border-radius:9px;background:#146b68;color:white;cursor:pointer}.note{color:#617181}.tag{padding:3px 7px;border-radius:5px;background:#e9f0f2}.bad{background:#fff0ef}.warn{background:#fff9ed}.down{color:#0c8075}.up{color:#ae6120}nav a{margin-right:12px}#dashboard{display:none}</style></head><body>
<main><section id="gate"><h1>Ben Health OS｜私人健康儀表板</h1><p>請使用授權的 Google 帳號登入，資料由 Firestore 讀取。</p><button id="login">使用 Google 登入</button><p id="authStatus" role="status">等待登入</p><a href="./index.html">返回原有健康管理首頁</a></section>
<div id="dashboard"><header><h1>Ben Health OS｜歷史分析儀表板</h1><p id="syncStatus" class="note">讀取私人資料中…</p><button id="theme">切換主題</button><button id="logout">登出</button></header><nav><a href="#weight">體重</a><a href="#weeks">週報</a><a href="#home">家用機</a><a href="#clinic">InBody</a><a href="#blood">檢驗</a></nav>
<section id="weight"><h2>體重趨勢</h2><svg id="wchart" viewBox="0 0 820 260"></svg></section>
<section id="weeks"><h2>歷史週報</h2><div class="scroll"><table><thead><tr><th>週次</th><th>期間</th><th>平均體重</th><th>變化</th><th>備註</th></tr></thead><tbody id="wtbody"></tbody></table></div></section>
<section id="home"><h2>家用身體組成</h2><div class="scroll"><table><tbody id="htbody"></tbody></table></div><svg id="fchart" viewBox="0 0 380 130"></svg><svg id="mchart" viewBox="0 0 380 130"></svg></section>
<section id="clinic"><h2>診所 InBody</h2><div class="scroll"><table><tbody id="ctbody"></tbody></table></div><div id="clinicDelta"></div></section>
<section id="blood"><h2>血液與尿液檢驗</h2><p class="note">兩次報告日期：<span data-lab-date></span>／<span data-lab-date></span></p><h3>血脂</h3><div class="scroll"><table><tbody id="lipidBody"></tbody></table></div><h3>肝功能</h3><div class="scroll"><table><tbody id="liverBody"></tbody></table></div><h3>其他</h3><div class="scroll"><table><tbody id="otherBody"></tbody></table></div><h3>尿液</h3><div class="scroll"><table><tbody id="urineBody"></tbody></table></div></section>
<section><h2>代謝症候群指標</h2><p>符合項目：<span id="metsCount">—</span></p><div class="scroll"><table><tbody id="metsBody"></tbody></table></div></section>
<section><h2>排除紀錄</h2><div class="scroll"><table><tbody id="exBody"></tbody></table></div></section>
</div></main><script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";
import{getAuth,GoogleAuthProvider,signInWithPopup,signOut,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";
import{firebaseConfig,ownerUid}from"./firebase-config.js";
const auth=getAuth(initializeApp(firebaseConfig));const status=document.getElementById("authStatus");
document.getElementById("login").onclick=async()=>{try{await signInWithPopup(auth,new GoogleAuthProvider())}catch(e){status.textContent="登入失敗："+(e.code||e.message)}};
document.getElementById("logout").onclick=()=>signOut(auth);
onAuthStateChanged(auth,async user=>{const allowed=user?.uid===ownerUid&&user.providerData.some(p=>p.providerId==="google.com");document.getElementById("gate").style.display=allowed?"none":"block";document.getElementById("dashboard").style.display="none";if(!allowed){status.textContent=user?"帳號未授權":"請使用 Google 登入";return}status.textContent="已授權";try{await import("./dashboard.js?v=20261020-authfix-2");document.getElementById("dashboard").style.display="block"}catch(e){status.textContent="讀取失敗："+(e.code||e.message);console.error(e)}});
</script></body></html>
